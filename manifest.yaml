kind: AIchorManifest
apiVersion: 0.2.3
builder:
  image: instanovo-sae
  dockerfile: ./Dockerfile.aichor
  context: .
  buildArgs:
    # Left at true even though this job never touches a GPU: a CUDA build of
    # torch runs fine on a CPU node (cuda.is_available() simply returns False),
    # and flipping it would rebuild the image from a different dependency set for
    # no gain.
    USE_CUDA: "true"
spec:
  operator: pytorch
  image: instanovo-sae
  # -------------------------------------------------------------------------
  # Ship run 1's surviving activation chunks to the bucket, so interpretation can
  # run off-cluster and the OpenAI key never has to reach this project's storage.
  #
  # Run 1 finished with KEEP_CHUNKS=0, which pruned 625 chunks to the 2-per-layer
  # cross-layer sample. That is ~683 MB across 11 files, small enough to pull
  # down and work with locally. PUBLISH_CHUNKS restricts itself to chunks whose
  # activations survived: meta and label files were written for all 625 and are
  # never pruned, so matching them wholesale would select ~6.5 GB of files with
  # no activations to pair with, and PUBLISH_MAX_GB would refuse the job.
  #
  # RUN_INTERPRET is deliberately absent. This job only republishes; every
  # earlier step finds its output present and skips, so it is the publish step
  # and nothing else.
  #
  # SKIP_TRAIN=1 is load-bearing even here. Without it a checkpoint that failed
  # to resolve would start a multi-hour training run instead of failing.
  #
  # MODEL_PATH must be the pretrained id. The default is ./instanovo_v1.1.0.ckpt,
  # which the path-form check rejects as missing before any step runs, even
  # though nothing here loads the model. DATASET_DIR points at the merged parquet
  # so Step 0 skips rather than re-merging 639k spectra.
  #
  # KEEP_CHUNKS is deliberately NOT set to 0: doing so again would delete the
  # 2-per-layer remainder that is the whole point of this job.
  #
  # To run interpretation on the cluster instead, place a key file on the PVC
  # and use:
  #   RUN_INTERPRET=1 SKIP_TRAIN=1 LAYERS_OVERRIDE="2 4"
  #   INTERPRET_ENV_FILE=/app/fm_mount/secrets/openai.env
  #   DATASET_DIR=/app/fm_mount/dataset
  #   MODEL_PATH=instanovo-v1.1.0
  #   OUTPUT_ROOT=/app/fm_mount/sae_pipeline_outputs bash ./run_pipeline.sh
  # Adding INTERPRET_DRY_RUN=1 builds every prompt, calls nothing, needs no key.
  #
  # Previous run (layers 6+8), kept for resubmission:
  #   RUN_CAUSAL=1 RUN_PHASE_8=0 LAYERS_OVERRIDE="6 8"
  #   TRAIN_NO_RAM_CACHE=1 DATASET_DIR=/app/fm_mount/dataset
  #   MODEL_PATH=instanovo-v1.1.0
  #   OUTPUT_ROOT=/app/fm_mount/sae_pipeline_outputs_l68 bash ./run_pipeline.sh
  # -------------------------------------------------------------------------
  command: >
    PUBLISH_CHUNKS=1 SKIP_TRAIN=1 LAYERS_OVERRIDE="2 4"
    DATASET_DIR=/app/fm_mount/dataset
    MODEL_PATH=instanovo-v1.1.0
    OUTPUT_ROOT=/app/fm_mount/sae_pipeline_outputs bash ./run_pipeline.sh
  tensorboard:
    enabled: false
  storage:
    attachExistingPVCs:
      # "app/fm_mount" (no leading slash) is the convention every working job on
      # this project's PVC uses, and AIchor resolves it to /app/fm_mount -- which
      # is what OUTPUT_ROOT in `command` above points at. Keep the two in sync.
      #
      # The PVC is the only real filesystem here: AIchor does not mount its
      # buckets. Bucket storage is reached separately, over S3 -- see the publish
      # step at the end of run_pipeline.sh.
      - name: "dtu-denovo-s-2e6da747d6d34f62-mass-spec-fo-3010d211a1d447cf"
        mountPoint: "app/fm_mount"
  debug:
    vscode:
      enabled: false
  types:
    worker:
      count: 1
      # No accelerator. Nothing in this job needs one: the single SAE encode over
      # the surviving chunks is a few minutes on CPU, and everything after it is
      # API latency. Asking for a GPU would put the job behind the same queue
      # that has held the layers 6+8 run unscheduled for hours, to leave the card
      # idle. DEVICE is left unset so run_pipeline.sh resolves it to cpu.
      #
      # 2 x 4 = 8 GB, ample for an upload: this job runs no model and holds no
      # activations in memory. An interpretation run on this manifest wants more --
      # one chunk's dense [n_tokens, d_dict] float32 matrix is 5.3 GB -- so raise
      # cpus to 4 for 16 GB there. Sized to schedule fast: a 24-core/96 GB ask sat
      # Unschedulable on this cluster.
      resources:
        cpus: 2
        ramRatio: 4
