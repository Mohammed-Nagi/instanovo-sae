kind: AIchorManifest
apiVersion: 0.2.3
builder:
  image: instanovo-sae
  dockerfile: ./Dockerfile.aichor
  context: .
  buildArgs:
    USE_CUDA: "true"
spec:
  operator: pytorch
  image: instanovo-sae
  # Layers are processed two at a time to keep peak PVC usage near 208 GB rather
  # than the ~416 GB all four would need. Each pair pays its own extraction
  # forward pass, and cross-layer matching runs within the pair. Run this with
  # LAYERS_OVERRIDE="2 4", then again with "6 8", then the Phase 8 pass.
  #
  # KEEP_CHUNKS=0 is required, not optional: without it the first pair's ~208 GB
  # stays on the volume and the second pair cannot fit. KEEP_CHUNK_SAMPLE (default
  # 2) still retains a token sample per layer so cross-layer matching across all
  # four layers remains possible in a later run.
  #
  # DATASET_DIR must sit under the mount. Its default is a relative path, which
  # resolves to ephemeral container disk, so the 639k-spectrum merge would be
  # redone and discarded on every run.
  #
  # RUN_CAUSAL=1 enables Phase 7 (loss recovered), one substitution pass over the
  # eval spectra. RUN_PHASE_8=0 keeps causal ablation off: its cost is
  # n_concepts x (1 + controls + ABLATION_PER_FEATURE_TOP) model passes per layer
  # and would dominate the run.
  # TRAIN_NO_RAM_CACHE=1 is set explicitly rather than left to choose_ram_cache.
  # That helper sizes against MemAvailable in /proc/meminfo, which in a container
  # is commonly the node's memory rather than this pod's cgroup limit -- so it
  # could conclude a 207 GB float32 layer cache fits and then be OOM-killed at the
  # pod limit, hours into training. Streaming is what it would pick anyway at any
  # RAM setting we would request here.
  # Invoked through `bash` rather than as ./run_pipeline.sh: the Dockerfile now
  # restores the executable bit, but going through the interpreter does not
  # depend on it at all, and losing it cost a full queue slot once already.
  command: >
    RUN_CAUSAL=1 RUN_PHASE_8=0 LAYERS_OVERRIDE="2 4" KEEP_CHUNKS=0
    TRAIN_NO_RAM_CACHE=1 DATASET_DIR=/app/fm_mount/dataset
    MODEL_PATH=instanovo-v1.1.0
    OUTPUT_ROOT=/app/fm_mount/sae_pipeline_outputs bash ./run_pipeline.sh
  tensorboard:
    enabled: false
  storage:
    attachExistingPVCs:
      # "app/fm_mount" (no leading slash) is the convention every working job on
      # this project's PVC uses, and AIchor resolves it to /app/fm_mount -- which
      # is what OUTPUT_ROOT in `command` above points at. Keep the two in sync.
      #
      # The PVC is the only real filesystem here: AIchor does not mount its
      # buckets, so this is where the ~415 GB of activations must land. Bucket
      # storage is reached separately, over S3 -- see the publish step at the end
      # of run_pipeline.sh.
      - name: "dtu-denovo-s-2e6da747d6d34f62-mass-spec-fo-3010d211a1d447cf"
        mountPoint: "app/fm_mount"
  debug:
    vscode:
      enabled: false
  types:
    worker:
      count: 1
      # Sized to be schedulable, not generous. A 24-core/96 GB pod sat
      # Unschedulable with the scheduler reporting 103 nodes short on memory and
      # 15 short on CPU, on top of the 295 with no free GPU -- so the ask was
      # excluding nodes the job would never have used.
      #
      # Nothing here scales with cores except annotation, which defaults to
      # os.cpu_count() and is a one-off pass. Extraction uses NUM_WORKERS=4
      # dataloader workers; training and evaluation are GPU-bound.
      #
      # 12 x 4 = 48 GB. Training streams rather than caching the layer (the
      # float32 cache would need ~207 GB and RAM_CACHE_SAFETY puts the bar near
      # 346 GB, unreachable at any figure worth requesting), and the streaming
      # peak is ~20-30 GB: ~332 MB per chunk plus cross-layer's ~4.9 GB token
      # sample per layer.
      resources:
        cpus: 12
        ramRatio: 4
        accelerators:
          gpu:
            count: 1
            type: gpu
            product: NVIDIA-H100-80GB-HBM3