kind: AIchorManifest
apiVersion: 0.2.3
builder:
  image: instanovo-sae
  dockerfile: ./Dockerfile.aichor
  context: .
  buildArgs:
    # Required: extraction, training and evaluation all run on the GPU. Leave it
    # true even for the CPU-only jobs this manifest sometimes carries -- a CUDA
    # build of torch runs fine on a CPU node, where cuda.is_available() simply
    # returns False, and flipping it rebuilds the image from a different
    # dependency set for no gain.
    USE_CUDA: "true"
spec:
  operator: pytorch
  image: instanovo-sae
  # -------------------------------------------------------------------------
  # Phase 8 (causal ablation) for layer 2, the only phase not yet run on real data.
  #
  # PHASE8_RESUME=1 sets EVAL_SKIP_PHASES="1 2 3 4 5 6 7 cross_seed cross_layer",
  # so this reruns nothing but the ablation, reusing the cached Phase 4 output.
  # It needs the model and dataset, not the activation chunks.
  #
  # ABLATION_PER_FEATURE_TOP=5 rather than the default 20. Cost is
  # n_concepts x (1 group + 5 controls + per_feature_top) passes over
  # ABLATION_SPECTRA spectra: 50 x 26 = 1300 conditions at the default against
  # 50 x 11 = 550 here, roughly 8 h against 3.4 h per layer on a MIG partition.
  #
  # Five is chosen, not zero, because the paper's null result is a SINGLE-feature
  # ablation of the highest-F1dom immonium detector, and _select_per_feature_targets
  # ranks by F1-dom, so rank 1 is exactly that feature. At zero the group result
  # would be all that survives, and the group is significantly selective: the
  # contrast the argument rests on would be lost. Five keeps it with margin.
  #
  # Run once per output root, changing OUTPUT_ROOT and LAYERS_OVERRIDE:
  #   /app/fm_mount/sae_pipeline_outputs      layers 2 and 4
  #   /app/fm_mount/sae_pipeline_outputs_l6   layer 6
  #   /app/fm_mount/sae_pipeline_outputs_l8   layer 8
  # -------------------------------------------------------------------------
  command: >
    PHASE8_RESUME=1 SKIP_TRAIN=1 ABLATION_PER_FEATURE_TOP=5
    LAYERS_OVERRIDE="2" KEEP_CHUNKS=1
    DATASET_DIR=/app/fm_mount/dataset
    MODEL_PATH=instanovo-v1.1.0
    OUTPUT_ROOT=/app/fm_mount/sae_pipeline_outputs bash ./run_pipeline.sh
  tensorboard:
    enabled: false
  storage:
    attachExistingPVCs:
      # "app/fm_mount" (no leading slash) is the convention every working job on
      # this project's PVC uses, and AIchor resolves it to /app/fm_mount -- which
      # is what OUTPUT_ROOT in `command` above points at. Keep the two in sync.
      #
      # The PVC is the only real filesystem here: AIchor does not mount its
      # buckets. Bucket storage is reached separately, over S3 -- see the publish
      # step at the end of run_pipeline.sh.
      - name: "dtu-denovo-s-2e6da747d6d34f62-mass-spec-fo-3010d211a1d447cf"
        mountPoint: "app/fm_mount"
  debug:
    vscode:
      enabled: false
  types:
    worker:
      count: 1
      # Phase 8 is model passes, so it needs the GPU. The MIG partition is
      # ample: peak is under 8 GB, the same passes Phase 7 already ran, and both
      # layer 6 and 8 trained here at full batch without an OOM.
      resources:
        cpus: 12
        ramRatio: 4
        accelerators:
          gpu:
            count: 1
            type: gpu
            product: NVIDIA-H100-80GB-HBM3-MIG-3g.40gb
