kind: AIchorManifest
apiVersion: 0.2.3
builder:
  image: instanovo-sae
  dockerfile: ./Dockerfile.aichor
  context: .
  buildArgs:
    # Required: extraction, training and evaluation all run on the GPU. Leave it
    # true even for the CPU-only jobs this manifest sometimes carries -- a CUDA
    # build of torch runs fine on a CPU node, where cuda.is_available() simply
    # returns False, and flipping it rebuilds the image from a different
    # dependency set for no gain.
    USE_CUDA: "true"
spec:
  operator: pytorch
  image: instanovo-sae
  # -------------------------------------------------------------------------
  # Publish the 12 chunks interpret.py will read, so interpretation can run off
  # the cluster and the OpenAI key never has to be written to shared storage.
  #
  # PUBLISH_CHUNK_IDS names them explicitly. All four layers now hold all 625
  # chunks, which is ~219 GB per root once activations are included, and
  # PUBLISH_MAX_GB refuses that. interpret.py's spread is deterministic
  # (spread_chunk_indices(625, 12)), so the ids are known before the job runs and
  # only what will actually be opened gets uploaded: ~4.2 GB for run 1's root,
  # ~2.2 GB for each single-layer root.
  #
  # Run once per output root, changing OUTPUT_ROOT and nothing else:
  #   /app/fm_mount/sae_pipeline_outputs       layers 2+4, LAYERS_OVERRIDE="2 4"
  #   /app/fm_mount/sae_pipeline_outputs_l6    layer 6,    LAYERS_OVERRIDE="6"
  #   /app/fm_mount/sae_pipeline_outputs_l8    layer 8,    LAYERS_OVERRIDE="8"
  #
  # No GPU: every pipeline step finds its output present and skips, leaving the
  # upload. SKIP_TRAIN=1 guards against a checkpoint that fails to resolve
  # starting a multi-hour training run instead of failing.
  # -------------------------------------------------------------------------
  command: >
    PUBLISH_CHUNKS=1
    PUBLISH_CHUNK_IDS="0,52,104,156,208,260,312,364,416,468,520,572"
    SKIP_TRAIN=1 KEEP_CHUNKS=1 LAYERS_OVERRIDE="2 4"
    DATASET_DIR=/app/fm_mount/dataset
    MODEL_PATH=instanovo-v1.1.0
    OUTPUT_ROOT=/app/fm_mount/sae_pipeline_outputs bash ./run_pipeline.sh
  tensorboard:
    enabled: false
  storage:
    attachExistingPVCs:
      # "app/fm_mount" (no leading slash) is the convention every working job on
      # this project's PVC uses, and AIchor resolves it to /app/fm_mount -- which
      # is what OUTPUT_ROOT in `command` above points at. Keep the two in sync.
      #
      # The PVC is the only real filesystem here: AIchor does not mount its
      # buckets. Bucket storage is reached separately, over S3 -- see the publish
      # step at the end of run_pipeline.sh.
      - name: "dtu-denovo-s-2e6da747d6d34f62-mass-spec-fo-3010d211a1d447cf"
        mountPoint: "app/fm_mount"
  debug:
    vscode:
      enabled: false
  types:
    worker:
      count: 1
      # No accelerator and a small ask, so this schedules immediately rather
      # than queueing. The job runs no model and holds no activations in memory;
      # it stats files and streams them to S3. DEVICE is left unset, so
      # run_pipeline.sh resolves it to cpu.
      resources:
        cpus: 2
        ramRatio: 4
